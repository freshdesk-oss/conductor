# Servers.
conductor.grpc-server.enabled=false

conductor.queue.type=redis_standalone
conductor.redis.hosts=${REDIS_HOST}:${REDIS_PORT}:${REDIS_RACK_HOSTED_ZONE}:${REDIS_PASSWORD}
conductor.redis.workflowNamespacePrefix=${REDIS_WORKFLOW_NS_PREFIX}
conductor.redis.queueNamespacePrefix=${REDIS_QUEUE_NS_PREFIX}
#conductor.redis.queuesNonQuorumPort=6379

conductor.app.stack=staging

# Database persistence type.
conductor.db.type=scylla

#spring.data.cassandra.keyspace-name=conductor
#spring.data.cassandra.contact-points=cassandra
#spring.data.cassandra.port=9042

conductor.scylla.hostAddress=${SCYLLA_HOST}
conductor.scylla.password=${SCYLLA_PASSWORD}
conductor.scylla.userName=${SCYLLA_USERNAME}
conductor.scylla.port=${SCYLLA_PORT}
conductor.scylla.cluster=scylla_cluster
conductor.scylla.keyspace=${SCYLLA_KEYSPACE}
conductor.scylla.replicationFactorValue=${SCYLLA_REPLICATIONFACTOR}
conductor.scylla.replicationStrategy=${SCYLLA_REPLICATION_STRATEGY}

# Workflow Execution configuration for cpu and memory limits
conductor.workflow-reconciler.enabled=true
conductor.workflow-monitor.enabled=true
conductor.workflow-monitor.stats.initial-delay=${WORKFLOW_MONITOR_STATS_INITIAL_DELAY}
conductor.workflow-monitor.stats.delay=${WORKFLOW_MONITOR_STATS_FIXED_DELAY}
conductor.workflow-repair-service.enabled=true

conductor.redis.queueShardingStrategy=${REDIS_QUEUE_SHARDING_STRATEGY}
conductor.app.executorServiceMaxThreadCount=${EXTOR_MAX_THREAD_COUNT}
conductor.app.systemTaskWorkerThreadCount=${SYSTEM_TASK_WORKER_THREAD_COUNT}

conductor.system-task-workers.enabled=true

# Hikari pool sizes are -1 by default and prevent startup
#spring.datasource.hikari.maximum-pool-size=10
#spring.datasource.hikari.minimum-idle=2

# Elastic search instance indexing is enabled.
conductor.indexing.enabled=false

conductor.workflow-scylla-execution-lock.enabled=true
conductor.redis-lock.serverAddress=redis://${REDIS_HOST}:${REDIS_PORT}
conductor.redis-lock.serverPassword=${REDIS_PASSWORD}
conductor.redis-lock.namespace=${REDIS_LOCK_NS_PREFIX}

# Transport address to elasticsearch
#conductor.elasticsearch.url=http://es:9200

# Name of the elasticsearch cluster
#conductor.elasticsearch.indexName=conductor

# Load sample kitchen sink workflow
loadSample=false

# Pushing Prom Metrics
conductor.metrics-prometheus.enabled = true

#Actuator Endpoints
management.endpoints.web.exposure.include=info,metrics,health,prometheus,httptrace,custom
management.endpoint.health.show-details=always
management.health.elasticsearch.enabled=false
management.health.elasticsearch.indicator.enabled=false
management.endpoint.health.group.readiness.exclude=elasticsearch
management.endpoint.health.group.liveness.exclude=elasticsearch
management.metrics.distribution.sla.http.server.requests=100ms,150ms,250ms,500ms,1s
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.enable.jvm=true
server.tomcat.mbeanregistry.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
conductor.executor.health.enabled=true

# Central-integrated data-deletion feature (consume ACCOUNT_DELETION_REQUESTED, hard delete, publish ACCOUNT_DELETION_STATUS) - always active
conductor.data-deletion.service=fs-caas
conductor.product=${PRODUCT:freshservice}
freshid.service.name=${FRESHID_SERVICE_NAME:freshidv2}

#kafka
spring.kafka.consumer.properties.security.protocol=SASL_PLAINTEXT
spring.kafka.consumer.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM}
spring.kafka.consumer.properties.sasl.jaas.config=${KAFKA_CONFIG};

spring.kafka.consumer.bootstrap-servers=${KAFKA_CONSUMER_BROKER_SERVERS}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP}
spring.kafka.consumer.auto-offset-reset=${KAFKA_CONSUMER_AUTO_OFFSET_RESET}
spring.kafka.consumer.enable-auto-commit=false
freshworks.boot.kafka.topics=${FW_BOOT_KAFKA_TOPICS}
freshworks.boot.kafka.deduperType=NOOP
freshworks.boot.kafka.consumerGroupId=${FW_BOOT_KAFKA_GROUP}

# Kafka producer connection (outbound ACCOUNT_DELETION_STATUS) - same Central cluster/credentials as the consumer above
spring.kafka.producer.bootstrap-servers=${KAFKA_CONSUMER_BROKER_SERVERS}
spring.kafka.producer.properties.security.protocol=SASL_PLAINTEXT
spring.kafka.producer.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM}
spring.kafka.producer.properties.sasl.jaas.config=${KAFKA_CONFIG};

# freshworks-boot-central-kafka-sdk publisher wiring (topic carrying outbound ACCOUNT_DELETION_STATUS)
freshworks.boot.kafka.producer.region=${REGION}
freshworks.boot.kafka.producer.pod=${POD}
freshworks.boot.kafka.producer.serviceName=${SERVICE}
freshworks.boot.kafka.producer.payloadType.ACCOUNT_DELETION_STATUS=${ACCOUNT_DELETION_STATUS_TOPIC:account-deletion-notifications}